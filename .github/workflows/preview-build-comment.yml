name: preview-build-comment

permissions:
  actions: read
  contents: read
  pull-requests: write

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

jobs:
  comment-preview-build:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Comment preview build on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- aerospace-preview-build -->';
            const workflowRun = context.payload.workflow_run;
            const pr = workflowRun.pull_requests?.[0];
            if (!pr) {
              core.info('No pull request attached to this workflow run.');
              return;
            }

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: workflowRun.id,
              per_page: 100,
            });

            const artifact = artifacts.artifacts.find(artifact =>
              artifact.name.startsWith('AeroSpace-preview-macos-15-')
            );
            if (!artifact) {
              core.info('No macos-15 preview artifact found for this workflow run.');
              return;
            }

            const artifactUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${workflowRun.id}/artifacts/${artifact.id}`;
            const shortSha = workflowRun.head_sha.slice(0, 7);
            const body = `${marker}
            Preview build for \`${shortSha}\` is ready.

            Download: [${artifact.name}](${artifactUrl})

            Install:
            1. Download and unzip the artifact. GitHub will give you a folder named \`AeroSpace-v0.0.0-SNAPSHOT\`.
            2. Move \`AeroSpace-v0.0.0-SNAPSHOT/AeroSpace.app\` to \`/Applications\`.
            3. Restart AeroSpace if it is already running.
            4. Optional CLI: \`cp AeroSpace-v0.0.0-SNAPSHOT/bin/aerospace /opt/homebrew/bin/aerospace-preview\`

            Notes:
            - This preview artifact expires in 7 days.
            - It is built from PR head commit \`${workflowRun.head_sha}\`.
            - Workflow run: ${workflowRun.html_url}
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }
